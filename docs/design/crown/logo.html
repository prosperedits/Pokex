<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crown logo frames</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c" style="width:288px;height:224px"></canvas>
<script src="../../../vendor/three.min.js"></script>
<script src="../../../vendor/GLTFLoader.js"></script>
<script src="../../../crown3d.js?v=32"></script>
<script>
  // The header logo: the regal crown Faisal picked, on its own, no cards (Faisal: "the crown we remake, but without the cards
  // in it"). window.__frame(i, n) poses frame i of one full turn; scripts/make-crown-logo.py stitches the frames.
  const o = {
    pixelRatio: 1, capture: true, model: '../../../assets/crown/crown-regal.glb?v=5', light: 'arcade', exposure: 1.3, envI: 1.3,
    camera: [[0, 1.3, 4.6], [0, 0.55, 0]], yaw: 0,
    onload: () => setTimeout(() => { window.__ready = true; }, 600),
  };
  const crown = CrownMark.mount(document.getElementById('c'), o);
  window.__frame = (i, n) => { o.yaw = (i / n) * Math.PI * 2; crown.render(1000, 0, 0); return true; };
</script>
</body></html>
